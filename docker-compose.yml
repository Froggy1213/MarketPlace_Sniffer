services:
  # --- Database ---
  db:
    image: postgres:15-alpine
    container_name: mercari_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Message Broker ---
  redis:
    image: redis:7-alpine
    container_name: mercari_redis
    restart: always
    ports:
      - "6379:6379"

  # --- Telegram Bot (Core) ---
  bot:
    build: .
    container_name: mercari_bot
    volumes:
      - .:/app:z
      - /app/.venv
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
    command: uv run python main.py
    restart: always

  # --- Background Worker (Playwright Scraper) ---
  worker:
    build: .
    container_name: mercari_worker
    volumes:
      - .:/app:z
      - /app/.venv
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy
    # Start Celery worker with eventlet/gevent or solo pool for async compatibility
    command: uv run celery -A app.worker.celery_app worker --loglevel=info --pool=solo

  # --- Task Scheduler  ---
  beat:
    build: .
    container_name: mercari_beat
    volumes:
      - .:/app:z
      - /app/.venv
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy
    command: uv run celery -A app.worker.celery_app beat --loglevel=info

volumes:
  postgres_data: